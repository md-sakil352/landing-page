<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/tailwind.css">
  <title>Summer Sale Landing Page</title>
  <script src="https://kit.fontawesome.com/9d640dc082.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="bg-[#F9F6E2] h-[873px]">
    <div class="flex m-auto max-w-[1400px] sm:flex-col lg:flex-row ">
      <div class="w-[700px] h-[340px] m-auto text-center">
        <p class="text-[32px]
        font-medium
        text-[#111111]
        leading-[100%]">--SALE FEVER--</p>
        <h2 class="font-bold
        text-[58px]
        leading-[100%]
        mt-12
        mb-24
        text-[#111111]">Purchase TK 200 or above & get <span class="text-[#E527B2]">20% off</span></h2>
        <p class="inline-block
        text-[24px]
        font-medium
        text-[#111111]
        ">Use Promo Code</p>
        <a class="font-semibold
        text-[24px]
        leading-[100%]
        bg-[#E527B2]
        rounded-lg
        px-8 py-3
        text-white
        ml-8" href="">SELL200</a>
      </div>
      <div class=":w-[700px] :h-[700px] sm:w-[500px] sm:h-[500px] sm:m-auto lg:w-[700px] lg:h-[700px]
        ">
        <img src="img/Summer 1.png" alt="">
      </div>
    </div>
  </div>


  <div class="max-w-[1400px] flex  justify-between m-auto mt-16">
    <div class="flex justify-evenly">
      <div>
        <div>
          <h1 class="font-semibold text-[40px] text-[#111111]">Kitchenware</h1>
        </div>
        <div class="w-[302px] h-[200px] bg-[#1111110D] flex items-center justify-center">
          <img src="img/Kitchenware01.png" alt="">
        </div>
        <div class="text-center ">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <h1>K.Accessories</h1>
          <p>39.00 TK</p>
        </div>
      </div>
      <div>

        <div class="w-[302px] h-[200px] bg-[#1111110D] flex items-center justify-center">
          <img src="img/Kitchenware02.png" alt="">
        </div>
        <div>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <h1>K.Accessories</h1>
          <p>25.00 TK</p>
        </div>
      </div>
      <div>

        <div class="w-[302px] h-[200px] bg-[#1111110D] flex items-center justify-center">
          <img src="img/Kitchenware03.png" alt="">
        </div>
        <div>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <h1>Home Cooker</h1>
          <p>49.00 TK</p>
        </div>
      </div>
    </div>
    <div>
      <div>
        <h1>Have coupon?</h1>
        <input type="text" placeholder="Coupon code">
        <button>Apply</button>
      </div>
      <div>
        <h1>1.Home Cooker</h1>
        <h1>2.Sports Cates</h1>
        <h1>1.Home Cooker</h1>
        <h1>Total Price: <span>257.00 TK</span></h1>
        <h1>Discount: <span>51.40 TK</span></h1>
        <h1>Total: <span>205.60 TK</span></h1>
        <button>Make Purchase</button>

      </div>
    </div>
  </div>
</body>

</html>
